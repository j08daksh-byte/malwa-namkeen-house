<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MALWA NAMKEEN HOUSE — THE NAMKEEN &amp; SNACKS HUB. Authentic Ratlami Sev, artisanal namkeens, crisp mathris and festive gifting." />
    <meta name="theme-color" content="#55000A" />
    <title>MALWA NAMKEEN HOUSE — THE NAMKEEN &amp; SNACKS HUB</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!-- Google Fonts — DM Sans modern neo-grotesk D2C typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
    />
  </head>
  <body>
    <div id="root">
      <div id="initial-preloader" style="position:fixed;inset:0;background:radial-gradient(ellipse at 50% 48%, #FFFDF8 0%, #F6EFE3 55%, #EBE1D0 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:system-ui,-apple-system,sans-serif;">
        <img src="/logo.png" alt="MALWA NAMKEEN HOUSE" style="height:100px;width:auto;max-width:80vw;object-fit:contain;animation:pulsePreloader 1.4s ease-in-out infinite alternate;" />
        <div style="margin-top:14px;color:#C99A32;font-size:11px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;">THE NAMKEEN &amp; SNACKS HUB</div>
      </div>
      <style>
        @keyframes pulsePreloader {
          0% { transform: scale(0.96); opacity: 0.88; }
          100% { transform: scale(1); opacity: 1; }
        }
      </style>
    </div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
